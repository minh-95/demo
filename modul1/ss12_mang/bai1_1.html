<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Viết chương trình khởi tạo một mảng số nguyên gồm 10 phần tử</title>
</head>
<body>
<script>

    let array = [1, 2, 3, 4, 5, 6, 7, 30, 20, 10];
    let count = 0;
    for (let i = 0; i < array.length; i++) {
        if (array[i] >= 10) {
            count++;
        }
    }
    alert(+count);
</script>
</body>
</html>
