<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Viết chương trình đếm số nguyên âm trong một chuỗi.</title>
</head>
<body>
<script>
    let number = +prompt("Bạn muốn nhập bao nhiêu số?");
    let array = new Array(number);
    for (let i = 0; i < array.length; i++) {
        array[i] = +prompt(`Nhập số nguyên thứ  ${i}`);
    }
    document.write("<br>số nguyên âm trong một chỗi là:<br>");
    for (let i = 0; i < array.length; i++) {
        if (array[i] < 0) {
            document.write(` ${array[i]}`);
        }
    }
</script>
</body>
</html>
