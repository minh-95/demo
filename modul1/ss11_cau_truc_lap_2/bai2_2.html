<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Tính giai thừa của một số nguyên dương</title>
</head>
<body>
<script>
    let n = +prompt("nhập số nguyên dương");
    let result = 1;
    for (let i = 2; i <= n; i++) {
        result *= i;
    }
    alert("Giai thừa là: " + result);
</script>
</body>
</html>
