<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> In tam giác vuông.</title>
</head>
<body>
<script>
    for (let row = 0; row <= 5; row++) {
        for (let col = 1; col <= row; col++) {
            document.write("*");
        }
        document.write("<br>");
    }


    for (let row = 0; row <= 5; row++) {
        for (let col = 0; col <= 6 - row; col++) {
            document.write("*");
        }
        document.write("<br>");
    }


</script>
</body>
</html>
