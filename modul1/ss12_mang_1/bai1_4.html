<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Viết chương trình khởi tạo hoặc nhập vào một mảng số nguyên và đảo ngược các phần tử trong mảng.</title>
</head>
<body>
<script>
    let number = [100, 900, 3, 4, 19, 14, 34, 30, 20, 10];
    document.write("1 mảng ban đầu<br>");
    for (let i = 0; i < number.length; i++) {
        document.write((i + 1) + "." + number[i] + "<br>");
    }
    document.write("<br> 2  mảng đã đảo ngược<br>");
    for (let i = number.length - 1; 0 <= i; i--) {
        document.write((i + 1) + "." + number[i] + "<br>");
    }
</script>
</body>
</html>
