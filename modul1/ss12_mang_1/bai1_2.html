<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Viết chương trình khởi tạo một mảng số nguyên gồm 10 phần tử khác nhau.</title>
</head>
<body>
<script>
    let array = [100, 2, 3, 4, 12, 14, 34, 30, 20, 10];
    let max = array[0];
    let maxx = 0;
    for (let i = 1; i < array.length; i++) {
        if (array[i] > max) {
            max = array[i];
            maxx = i;
        }
    }
    alert("số lớn nhất là:" + max + "vi tri là :" + maxx);
</script>
</body>
</html>
