<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>bài 7</title>
</head>
<body>
<script>
    let array = [3, 45, 7, 78, 3, 5, 62, 6,];
    let v = +prompt("nhậo giá trị v cần xoá");
    for (let i = 0; i < array.length; i++) {
        if (array[i] === v) {
            for (let j = 0; j < array.length - 1; j++) {
                array[j] = array[j + 1];
            }
            array[array.length - 1] = 0;
            i--;
        }
    }
    alert(array);

</script>
</body>
</html>
