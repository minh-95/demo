<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>bài 4</title>
</head>
<body>
<script>
    let n = +prompt("Nhập kích thước mảng:");
    let number = [];
    for (let i = 0; i < n; i++) {
        number[i] = prompt(`Nhập phần tử thứ ${i}:`);
    }
    let count = 0;
    for (let i = 0; i < number.length; i++) {
        if (isNaN(+number[i])) {
            count++;
        }
    }

    alert("Số phần tử không phải là số: " + count);
</script>
</body>
</html>
