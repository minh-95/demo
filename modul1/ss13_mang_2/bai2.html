<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>bài 2</title>
</head>
<body>
<script>
    let array = ['c', 's', 'c', '2', '6', '1'];
    document.write("mảng ban đầu là: <br>");
    for (let i = 0; i < array.length; i++) {
        document.write(`${array[i]}`);
    }
    document.write("<br> mảng đảo ngược là:<br>");
    for (let i = array.length - 1; i >= 0; i--) {
        document.write(`${array[i]}`);
    }
</script>
</body>
</html>
