<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>bài 6</title>
</head>
<body>
<script>
    let chuoi = +prompt("Nhập vào một chuỗi ký tự (ví dụ: a-b-c--d):");
    let chuoiMoi = "";
    for (let i = 0; i < chuoi.length; i++) {
        if (chuoi[i] === '-') {
            chuoiMoi += '_';
        } else {
            chuoiMoi += chuoi[i];
        }
    }
    alert("Chuỗi sau khi thay thế là: " + chuoiMoi);
</script>
</body>
</html>
