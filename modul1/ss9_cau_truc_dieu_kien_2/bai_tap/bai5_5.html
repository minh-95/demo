<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>tính diện tích tam giác vuông</title>
</head>
<body>
<script>
    // diện tích tam giác vuông khi biết hai cạnh kề a và b
    // S=(1/2)*a*b
    let a = parseFloat(prompt("nhập a"));
    let b = parseFloat(prompt("nhập b"));
    let s = (1 / 2) * a * b;
    alert(`S ${s}`);
</script>
</body>
</html>
