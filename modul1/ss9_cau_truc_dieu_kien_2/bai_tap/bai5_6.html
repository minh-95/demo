<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>giải phương trình bậc 1</title>
</head>
<body>
<script>
    // công thức giải phương trình bậc : ax+b=0
    let a = +prompt("nhập a");
    let b = +prompt("nhập b");
    let x;
    if (a === 0) {
        if (b === 0) {
            alert("phương trình vô số nghiệm");
        } else {
            alert("phương trình vô nghiệm");
        }
    } else {
        (x = -b / a)
        alert(` nghệm của phương trình x là: ${x} `);


    }
</script>
</body>
</html>
