<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>gii phương trình bậc 2</title>
</head>
<body>
<script>
    // ax2+bx+c=0
    let a = +prompt("nhập a");
    let b = +prompt("nhập b");
    let c = +prompt("nhập c");
    let delta = b ** 2 - 4 * a * c;
    if (delta < 0) {
        alert("phương trình vô nghiệm");

    } else if (delta === 0) {
        let y = -b / (2 * a);
        alert("phương trình có nghiệm kép" + y)
    } else {
        let canHai = delta ** (1 / 2);
        let x1 = (-b + canHai) / (2 * a);
        let x2 = (-b - canHai) / (2 * a);
        alert(`phương trình có 2 nghiệm, x1 là : ${x1}  x2 là: ${x2}`);
    }
</script>
</body>
</html>
