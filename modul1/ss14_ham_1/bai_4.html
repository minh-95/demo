<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>bài 4</title>
</head>
<body>

<h2>Kết quả cộng hai số:</h2>
<p id="result"></p>

<script>
    function addNumbers() {
        let firstNum = 4;
        let secondNum = 8;
        let result = firstNum + secondNum;
        return result;
    }

    let result = addNumbers();
    document.getElementById("result").innerText = "Tổng là: " + result;

</script>

</body>
</html>
