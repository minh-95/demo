<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>bài 2</title>
</head>
<body>
<h2>kết quả:</h2>
<p id="result"></p>
<script>
    function increaseNumber(num) {
        return num + 1;
    }

    let originalNumber = 5;
    let increased = increaseNumber(originalNumber);
    document.getElementById("result").innerText = `giá trị ban đầu là :${originalNumber}, sau khi tăng là : ${increased}`;
</script>
</body>
</html>
