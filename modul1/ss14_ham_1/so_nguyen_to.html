<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>số nguyên tố</title>
</head>
<body>
<h2>kết quả kiểm tra số nguyên tố:</h2>
<p id="output"></p>
<script>
    function isPrime(n) {
        if (n < 2) {
            return false;
        }
        for (let i = 2; i <= Math.sqrt(n); i++) {
            if (n % i === 0) {
                return false;
            }

        }
        return true;
    }

    let number = +prompt("nhập số để kiểm tra:");
    if (isPrime(number)) {
        document.getElementById("output").innerText = number + " : là số nguyên";
    } else {
        document.getElementById("output").innerText = number + " : không phải là số nguyên";
    }
</script>
</body>
</html>
