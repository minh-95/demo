<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chuyển đổi giữa feet và meters</title>
</head>
<body>
<h2>Kết quả chuyển đổi:</h2>

<script>

    let feetA = +prompt("Nhập số feet:");
    let meter = +prompt("Nhập số mét:");
    function footToMeter(feet) {
        return 0.305 * feet;
    }

    function meterToFoot(meters) {
        return 3.279 * meters;
    }

    document.write(`${feetA} feet = ${footToMeter(feetA)} meters<br>`);
    document.write(`${meter} meters = ${meterToFoot(meter)} feet`);
</script>
</body>
</html>
