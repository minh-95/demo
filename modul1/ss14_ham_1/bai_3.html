<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>bài 3</title>
</head>
<body>
<script>

    function compareAndSum(a, b) {
        if (a > b) {
            alert("Tham số thứ nhất lớn hơn tham số thứ hai.");
        } else {
            return a + b;
        }
    }

    let result = compareAndSum(3, 7);

    if (result !== undefined) {
        document.write("Tổng của hai số là: " + result);
    }
</script>
</body>
</html>
