<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>bài 2</title>
</head>
<body>
<script>
    function tinhDienTich(r) {
        return Math.PI * r * r;
    }

    function tinhChuVi(r) {
        return 2 * Math.PI * r;
    }

    let banKinh = +prompt("Nhập bán kính hình tròn:");
    let dienTich = tinhDienTich(banKinh);
    let chuVi = tinhChuVi(banKinh);

    alert(`Với bán kính là: ${banKinh}\n- Diện tích: ${dienTich.toFixed(2)}\n- Chu vi: ${chuVi.toFixed(2)}`);
</script>
</body>
</html>
