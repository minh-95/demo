<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>bài 5</title>
</head>
<body>
<script>
    function soNhoNhat(a, b, c) {
        let min = a;
        if (b < min) min = b;
        if (c < min) min = c;
        return min;
    }

    let so1 = +prompt("Nhập số nguyên thứ nhất:");
    let so2 = +prompt("Nhập số nguyên thứ hai:");
    let so3 = +prompt("Nhập số nguyên thứ ba:");
    let ketQua = soNhoNhat(so1, so2, so3);
    alert(`Số nhỏ nhất trong ba số là: ${ketQua}`);
</script>
</body>
</html>
