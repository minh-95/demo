<!DOCTYPE html>

    <title>bài 8</title>

<body>
<script>
    function daoNguocMang(mang) {
        return mang.reverse();
    }

    let mang = [1, 2, 3, 4, 5];
    let mangDao = daoNguocMang(mang);
    alert(`Mảng sau khi đảo ngược: ${mangDao}`);
</script>
</body>
