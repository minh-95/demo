<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>bài 4</title>
</head>
<body>
<script>
    function kyTuSo(kyTu) {
        return kyTu >= '0' && kyTu <= '9';
    }

    let kyTuNhap = prompt("Nhập một ký tự:");
    let ketQua = kyTuSo(kyTuNhap);
    alert(`Ký tự "${kyTuNhap}" là số? ${ketQua}`);
</script>
</body>
</html>
