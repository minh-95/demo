<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>bài 1</title>
</head>
<body>
<script>
    function tinhBinhPhuong(so) {
        return so * so;
    }

    let nhapSo = +prompt("Nhập một số bất kỳ:");
    let ketQua = tinhBinhPhuong(nhapSo);
    alert(`Bình phương của ${nhapSo} là ${ketQua}`);

</script>
</body>
</html>
