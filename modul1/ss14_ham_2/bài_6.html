<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>bài 6</title>
</head>
<body>
<script>
    function laSoNguyenDuong(n) {
        if (n > 0 && n % 1 === 0) {
            return true;
        } else {
            return false;
        }
    }

    let soNhap = +prompt("Nhập một số:");
    let ketQua = laSoNguyenDuong(soNhap);

    alert(`${soNhap} là số nguyên dương ${ketQua}`);
</script>
</body>
</html>
