<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Viết chương trình tính lãi ngân hàng (lãi mẹ đẻ lại con) khi biết số tiền ban đầu, số tháng cho vay và lãi xuất hàng tháng.</title>
</head>
<body>
<script>
  let soTienVay = +prompt("nhập số tiên vay:");
  let soThangVay = +prompt("nhập số tháng gửi");
  let soTienLai = +prompt("nhập số tiền lãi % :");

  if (soTienVay > 0 || soThangVay > 0 || soTienLai > 0) {
    let tienGocHangThang = soTienVay / soThangVay;
    let tienLaiHangThang= soTienVay *(soTienLai/100)/soThangVay;
    alert(`tổng số tiền phải trả: (${tienGocHangThang} + ${tienLaiHangThang} )VND`);
  }
</script>
</body>
</html>
