<!DOCTYPE html>

    <meta charset="UTF-8">
    <title>Title</title>

<body>

<script>


    let a = 0;
    let b = 1;
    let sum = a + b;
    while (sum % 5 !== 0) {

        a = b;
        b = sum;
        sum = a + b;
    }
    alert("số đầu tiên chia hết cho 5 là:"+sum);

</script>
</body>
