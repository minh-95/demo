<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>sinh bảng cửu chương</title>
</head>
<body>
<h1>Bảng Cửu Chương</h1>
<table border="1">
    <script>
        for (let i = 1; i <= 10; i++) {
            document.write("<tr>");
            for (let c = 2; c <= 10; c++) {
                document.write(`<td>${c} x ${i} = ${c * i}</td>`);
            }
            document.write("</tr>");
        }
    </script>
</table>


</body>
</html>
