<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>hoa hồng</title>
</head>
<body>
<script>
    let doanhSo = +prompt("nhập doanh số ");
    if(doanhSo>=10000000){
        alert("số tiền hoa hồng bạn nhận được" +doanhSo * 0.15);
    }else if (doanhSo >=5000000){
        alert("số tiền hoa hông ban nhận được" +doanhSo * 0.10);
    }else {
        alert("số tiền hoa hồng bạn nhận được bằng 0")
    }

</script>
</body>
</html>
