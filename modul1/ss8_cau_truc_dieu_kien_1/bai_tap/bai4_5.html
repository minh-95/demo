<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
  let kiemTra = +prompt("nhập điểm kiểm tra");
  let giuaKy = +prompt("nhập điểm thi giữa kỳ");
  let cuoiKy= +prompt("nhập điểm thi cuối kỳ");
  let trungBinh = (kiemTra + giuaKy+ cuoiKy)/3;
  if (trungBinh >=80) {
    alert("giỏi");
  }else if (trungBinh >=70){
    alert("khá");
  }else if (trungBinh >=50){
    alert("trung bình");
  }else {
    alert("yếu");
  }
</script>
</body>
</html>
